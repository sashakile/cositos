# cositos git hooks (lefthook).
#
# Gate commands are defined once as mise tasks (see mise.toml); lefthook just invokes
# them so there is a single source of truth.
#
# NOTE: beads owns `core.hooksPath` (-> .beads/hooks) for its jsonl sync + typos/vale.
# The beads-managed pre-commit/pre-push delegate to `lefthook run <hook>` so both run.
# See docs/hooks.md.

pre-commit:
  parallel: true
  commands:
    # <!-- SPK:START -->
    specodelic-gates:
      run: spk lint openspec
    # <!-- SPK:END -->
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    lint:
      glob: "*.py"
      run: mise run lint
    format:
      glob: "*.py"
      run: uv run --extra dev ruff format --check src tests
    typecheck-py:
      glob: "src/**/*.py"
      run: mise run typecheck
    typecheck-js:
      glob: "front/src/**/*.js"
      run: mise run front-typecheck
    complexity:
      glob: "*.{py,js}"
      run: mise run complexity
    coverage-audit:
      run: mise run coverage-audit

pre-push:
  parallel: false
  commands:
# ah:managed:start
    ah-check-push:
      run: ah check
# ah:managed:end
    coverage-py:
      run: mise run coverage
    coverage-js:
      run: mise run front-coverage
    julia:
      run: mise run julia-test
    specs:
      run: mise run specs
    claims:
      run: mise run claims
